apiVersion: "nais.io/v1alpha1"
kind: "Application"
metadata:
  name: familie-integrasjoner
  namespace: teamfamilie
  labels:
    team: teamfamilie

spec:
  image: {{ image }}
  port: 8085
  envFrom:
    - secret: familie-integrasjoner-servicebruker
  liveness:
    path: /internal/status/isAlive
    initialDelay: 30
    timeout: 5
    failureThreshold: 10
  readiness:
    path: /internal/status/isAlive
    initialDelay: 30
    timeout: 5
    failureThreshold: 10
  vault:
    enabled: false
  webproxy: true
  azure:
    application:
      tenant: "trygdeetaten.no"
      enabled: true
      claims:
        groups:
          - id: "dbe4ad45-320b-4e9a-aaa1-73cca4ee124d"
          - id: "2e1dc582-f762-4510-a660-88bf68fb7128"
          - id: "a1b518e2-3947-478d-8929-e5d685c47cac"
          - id: "93a26831-9866-4410-927b-74ff51a9107c"
          - id: "d21e00a4-969d-4b28-8782-dc818abfae65"
          - id: "9449c153-5a1e-44a7-84c6-7cc7a8867233"
          - id: "01166863-22f1-4e16-9785-d7a05a22df74"
          - id: "ee5e0b5e-454c-4612-b931-1fe363df7c2c"
          - id: "19dcbfde-4cdb-4c64-a1ea-ac9802b03339"
        extra:
          - "NAVident"
  tokenx:
    enabled: true
  accessPolicy:
    inbound:
      rules:
        - application: familie-ks-sak
          cluster: dev-gcp
        - application: familie-ba-sak
          cluster: dev-gcp
        - application: familie-ba-minside-frontend
          cluster: dev-gcp
        - application: familie-tilbake
          cluster: dev-gcp
        - application: familie-tilbake-lokal
          cluster: dev-gcp
        - application: tilbakekreving-backend
          namespace: tilbake
          cluster: dev-gcp
        - application: familie-baks-mottak
          cluster: dev-gcp
        - application: familie-ef-mottak
          cluster: dev-gcp
        - application: familie-klage
          cluster: dev-gcp
        - application: familie-klage-lokal
          cluster: dev-gcp
        - application: familie-ef-sak
          cluster: dev-gcp
        - application: familie-ef-sak-lokal
          cluster: dev-gcp
        - application: familie-ef-iverksett
          cluster: dev-gcp
        - application: familie-ef-iverksett-lokal
          cluster: dev-gcp
        - application: familie-ef-personhendelse
          cluster: dev-gcp
        - application: azure-token-generator
          namespace: nais
          cluster: dev-gcp
        - application: tokenx-token-generator
          namespace: nais
          cluster: dev-gcp
    outbound:
      rules:
        - application: modiacontextholder
          namespace: personoversikt
        - application: logging
          namespace: nais-system
        - application: skjermede-personer-pip
          namespace: nom
        - application: norg2
          namespace: org
      external:
        - host: aareg-services.dev-fss-pub.nais.io
        - host: arbeid-og-inntekt-q2.dev-fss-pub.nais.io
        - host: dokarkiv-q2.dev-fss-pub.nais.io
        - host: dokarkiv.dev.intern.nav.no
        - host: dokarkiv-q2.dev.intern.nav.no
        - host: dokdistfordeling-q2.dev-fss-pub.nais.io
        - host: dokdistkanal.dev-fss-pub.nais.io
        - host: ereg-services.dev-fss-pub.nais.io
        - host: foerstesidegenerator-q2.dev-fss-pub.nais.io
        - host: graph.microsoft.com
        - host: kodeverk-api.intern.nav.no
        - host: norg2.dev-fss-pub.nais.io
        - host: oppgave.dev-fss-pub.nais.io
        - host: pdl-api.dev-fss-pub.nais.io
        - host: regoppslag.dev-fss-pub.nais.io
        - host: saf-q2.dev-fss-pub.nais.io
        - host: safselvbetjening.dev.intern.nav.no
        - host: sak-q2.dev-fss-pub.nais.io
#        - host: skjermede-personer-pip.dev-fss-pub.nais.io
  prometheus:
    enabled: true
    path: /internal/prometheus
  replicas:
    min: 2
    max: 2
  resources:
    limits:
      memory: 2Gi
    requests:
      memory: 1Gi
      cpu: 200m

  ingresses: # Optional. List of ingress URLs that will route HTTP traffic to the application.
    - https://familie-integrasjoner-gcp.intern.dev.nav.no
  observability:
    logging:
      destinations:
        - id: elastic
        - id: loki
    autoInstrumentation:
      enabled: true
      runtime: java
  env:
    - name: SPRING_PROFILES_ACTIVE
      value: gcp
    - name: ON_PREM_URL_ENV
      value: dev
